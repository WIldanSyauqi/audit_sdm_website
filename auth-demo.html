<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Demo Audit SDM</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-2: #3730a3;
      --text: #172033;
      --muted: #697586;
      --border: #e5e7eb;
      --success: #159957;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: var(--text);
    }
    .box {
      width: min(440px, 92vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);
    }
    h2 { margin: 0 0 8px; }
    p { margin: 0 0 18px; color: var(--muted); }
    .roles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .role {
      padding: 7px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
    }
    .field { display: grid; gap: 8px; margin-bottom: 12px; }
    input, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      font-size: 15px;
    }
    input:focus { outline: 2px solid rgba(79,70,229,.18); border-color: var(--primary); }
    button {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      border: none;
      font-weight: 800;
      cursor: pointer;
    }
    .status {
      margin-top: 14px;
      font-size: 13px;
      color: var(--success);
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login Audit SDM</h2>
    <p>Gunakan akun role berikut untuk menguji akses sistem.</p>
    <div class="roles">
      <span class="role">Admin</span>
      <span class="role">Auditor</span>
      <span class="role">Manager</span>
      <span class="role">Viewer</span>
    </div>
    <div class="field">
      <input id="email" type="email" value="admin@audit.local" placeholder="Email" />
    </div>
    <div class="field">
      <input id="password" type="password" value="admin123" placeholder="Password" />
    </div>
    <button onclick="login()">Masuk ke Sistem</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const users = {
      'admin@audit.local': { password: 'admin123', role: 'admin', name: 'Administrator' },
      'auditor@audit.local': { password: 'auditor123', role: 'auditor', name: 'Auditor SDM' },
      'manager@audit.local': { password: 'manager123', role: 'manager', name: 'Manager HR' },
      'viewer@audit.local': { password: 'viewer123', role: 'viewer', name: 'Viewer Audit' }
    };

    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const user = users[email];
      const status = document.getElementById('status');

      if (!user || user.password !== password) {
        status.textContent = 'Email atau password salah.';
        return;
      }

      status.textContent = `Login berhasil sebagai ${user.role.toUpperCase()} (${user.name})`;
      localStorage.setItem('demoAuditUser', JSON.stringify({ email, role: user.role, name: user.name }));
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
