services:
  - type: web
    name: audit-sdm-website
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_CLIENT
        value: postgres
      - key: PUBLIC_DEMO
        value: true
      - key: DATABASE_URL
        sync: false
